<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(30,8,20,0.55) 0%, transparent 40%),
      radial-gradient(circle at 85% 65%, rgba(6,10,30,0.6) 0%, transparent 45%),
      #050506;
    color: #eef1f6;
    position: relative;
    overflow-x: hidden;
  }

  #starCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    content: "";
    position: fixed;
    top: -10%;
    left: 50%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(236,72,153,0.10) 0%, rgba(59,130,246,0.07) 45%, transparent 70%);
    filter: blur(60px);
    transform: translateX(-50%);
    animation: shine 9s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes shine {
    0%   { transform: translate(-70%, 0); opacity: 0.6; }
    50%  { transform: translate(-30%, 40px); opacity: 1; }
    100% { transform: translate(-70%, 0); opacity: 0.6; }
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 20px;
    background: rgba(5,5,6,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .header-inner {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; background: #111; }
  .brand span { font-size: 14px; font-weight: 700; }
  nav { display: flex; gap: 28px; }
  nav a { color: #cdd3de; text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
  nav a:hover { color: #60a5fa; }

  section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    position: relative;
    z-index: 1;
  }

  #home { text-align: center; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #60a5fa;
    background: rgba(96,165,250,0.08);
    border: 1px solid rgba(96,165,250,0.25);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 24px;
  }
  #groupName { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 32px; max-width: 800px; }
  .stat-row {
    display: flex;
    gap: 1px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    overflow: hidden;
  }
  .stat-cell { background: rgba(10,10,12,0.7); text-align: center; padding: 22px 32px; }
  .stat-cell .num { font-size: 26px; font-weight: 800; color: #fff; }
  .stat-cell .lbl { font-size: 11px; color: #8b93a3; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }

  #games h2, #contact h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .section-sub { color: #8b93a3; font-size: 14px; margin-bottom: 40px; }
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
    gap: 8px;
    max-width: 500px;
    width: 100%;
  }
  .game-card {
    background: rgba(10,10,12,0.7);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .game-card:hover { border-color: rgba(96,165,250,0.35); transform: translateY(-2px); }
  .game-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #111; }
  .game-card .info { padding: 4px 5px; }
  .game-card .name {
    font-size: 8px; font-weight: 700; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-card .row { display: flex; gap: 5px; flex-wrap: wrap; }
  .game-card .metric { display: flex; flex-direction: column; gap: 0; }
  .game-card .metric .v { font-size: 7px; font-weight: 700; color: #fff; }
  .game-card .metric .k { font-size: 6px; color: #8b93a3; text-transform: uppercase; }

  #contact { text-align: center; }
  .discord-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #5865F2;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 10px;
    margin-top: 20px;
    margin-bottom: 50px;
    transition: opacity 0.2s ease;
  }
  .discord-btn:hover { opacity: 0.88; }

  .team-label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8b93a3; margin-bottom: 16px; }
  .team-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(10,10,12,0.7);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 20px;
  }
  .team-card img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #111; }
  .team-card .details { text-align: left; }
  .team-card .name { font-size: 15px; font-weight: 700; }
  .team-card .role { font-size: 12px; color: #60a5fa; font-weight: 600; }
</style>
</head>
<body>

  <canvas id="starCanvas"></canvas>

  <header>
    <div class="header-inner">
      <div class="brand">
        <img id="groupIcon" src="" alt="">
        <span id="brandName">Loading...</span>
      </div>
      <nav>
        <a href="#home">Home</a>
        <a href="#games">Games</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section id="home">
    <div class="badge">Roblox Game Studio</div>
    <div id="groupName">Loading...</div>
    <div class="stat-row" id="statRow">
      <div class="stat-cell"><div class="num" id="memberCount">—</div><div class="lbl">Members</div></div>
      <div class="stat-cell"><div class="num" id="totalVisits">—</div><div class="lbl">Total Visits</div></div>
      <div class="stat-cell"><div class="num" id="totalPlaying">—</div><div class="lbl">Playing Now</div></div>
    </div>
  </section>

  <section id="games">
    <h2>Games</h2>
    <div class="section-sub">Everything we've shipped, with live stats. Click one to play.</div>
    <div class="games-grid" id="gamesGrid"></div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <div class="section-sub">Join our community or reach out directly.</div>
    <a class="discord-btn" href="https://discord.gg/8N4Cy77Znd" target="_blank" rel="noopener">
      Join our Discord
    </a>

    <div class="team-label">The Team</div>
    <div class="team-card">
      <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Owner avatar">
      <div class="details">
        <div class="name">Owner</div>
        <div class="role">Owner</div>
      </div>
    </div>
  </section>

  <script>
    fetch("/api/stats?type=groupGames&groupId=936632772")
      .then(r => r.json())
      .then(data => {
        document.getElementById("groupName").textContent = data.group.name;
        document.getElementById("brandName").textContent = data.group.name;
        document.getElementById("memberCount").textContent = data.group.memberCount.toLocaleString();
        if (data.group.icon) document.getElementById("groupIcon").src = data.group.icon;

        const totalVisits = data.games.reduce((sum, g) => sum + g.visits, 0);
        const totalPlaying = data.games.reduce((sum, g) => sum + g.playing, 0);
        document.getElementById("totalVisits").textContent = totalVisits.toLocaleString();
        document.getElementById("totalPlaying").textContent = totalPlaying.toLocaleString();

        const grid = document.getElementById("gamesGrid");
        data.games.forEach(g => {
          const card = document.createElement("a");
          card.className = "game-card";
          card.href = g.placeId ? `https://www.roblox.com/games/${g.placeId}` : "#";
          card.target = "_blank";
          card.rel = "noopener";
          card.innerHTML = `
            <img src="${g.icon || ''}" alt="${g.name}">
            <div class="info">
              <div class="name">${g.name}</div>
              <div class="row">
                <div class="metric"><div class="v">${g.visits.toLocaleString()}</div><div class="k">Visits</div></div>
                <div class="metric"><div class="v">${g.playing.toLocaleString()}</div><div class="k">Play</div></div>
                <div class="metric"><div class="v">${g.likeRatio}</div><div class="k">Like</div></div>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById("groupName").textContent = "Error loading stats";
        document.getElementById("gamesGrid").innerHTML = `<div style="color:#f87171;font-size:13px;">${err.message}</div>`;
      });

    const canvas = document.getElementById("starCanvas");
    const ctx = canvas.getContext("2d");
    let vw, vh, docH, stars;
    const mouse = { x: -9999, y: -9999 };

    function resize() {
      vw = canvas.width = window.innerWidth;
      vh = canvas.height = window.innerHeight;
      docH = document.body.scrollHeight;
      const count = Math.floor((vw * docH) / 9000);
      stars = Array.from({ length: count }, () => {
        const x = Math.random() * vw;
        const y = Math.random() * docH;
        return { x, y, baseX: x, baseY: y, r: Math.random() * 1.2 + 0.4 };
      });
    }

    window.addEventListener("resize", resize);
    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener("mouseleave", () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    function animate() {
      ctx.clearRect(0, 0, vw, vh);
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      const scrollY = window.scrollY;
      const repelRadius = 160;

      for (const s of stars) {
        const screenY = s.y - scrollY;
        if (screenY < -20 || screenY > vh + 20) continue;

        const dx = s.x - mouse.x;
        const dy = screenY - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < repelRadius) {
          const force = (repelRadius - dist) / repelRadius;
          s.x += (dx / dist) * force * 8;
          s.y += (dy / dist) * force * 8;
        } else {
          s.x += (s.baseX - s.x) * 0.04;
          s.y += (s.baseY - s.y) * 0.04;
        }

        ctx.beginPath();
        ctx.arc(s.x, s.y - scrollY, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }

    resize();
    animate();
  </script>
</body>
</html>
