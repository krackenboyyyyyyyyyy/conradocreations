<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #050506;
    color: #eef1f6;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    top: -10%;
    left: 50%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(236,72,153,0.10) 0%, rgba(59,130,246,0.07) 45%, transparent 70%);
    filter: blur(60px);
    transform: translateX(-50%);
    animation: shine 9s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes shine {
    0%   { transform: translate(-70%, 0); opacity: 0.6; }
    50%  { transform: translate(-30%, 40px); opacity: 1; }
    100% { transform: translate(-70%, 0); opacity: 0.6; }
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 18px 20px;
    background: rgba(5,5,6,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  nav a {
    color: #cdd3de;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  nav a:hover { color: #60a5fa; }

  section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    position: relative;
    z-index: 1;
  }

  #home { text-align: center; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #60a5fa;
    background: rgba(96,165,250,0.08);
    border: 1px solid rgba(96,165,250,0.25);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 24px;
  }
  #groupName {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 32px;
    max-width: 800px;
  }
  .stat-row {
    display: flex;
    gap: 1px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    overflow: hidden;
  }
  .stat-cell { background: #0a0a0c; text-align: center; padding: 22px 32px; }
  .stat-cell .num { font-size: 26px; font-weight: 800; color: #fff; }
  .stat-cell .lbl { font-size: 11px; color: #8b93a3; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }

  #games h2, #contact h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .section-sub { color: #8b93a3; font-size: 14px; margin-bottom: 40px; }
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    max-width: 900px;
    width: 100%;
  }
  .game-card {
    background: #0a0a0c;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .game-card:hover { border-color: rgba(96,165,250,0.35); transform: translateY(-3px); }
  .game-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #111;
  }
  .game-card .info { padding: 14px 16px; }
  .game-card .name { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .game-card .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .game-card .metric { display: flex; flex-direction: column; gap: 2px; }
  .game-card .metric .v { font-size: 13px; font-weight: 700; color: #fff; }
  .game-card .metric .k { font-size: 10px; color: #8b93a3; text-transform: uppercase; letter-spacing: 0.04em; }

  #contact { text-align: center; }
  .discord-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #5865F2;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 10px;
    margin-top: 20px;
    transition: opacity 0.2s ease;
  }
  .discord-btn:hover { opacity: 0.88; }
</style>
</head>
<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#games">Games</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="home">
    <div class="badge">Roblox Game Studio</div>
    <div id="groupName">Loading...</div>
    <div class="stat-row" id="statRow">
      <div class="stat-cell"><div class="num" id="memberCount">—</div><div class="lbl">Members</div></div>
      <div class="stat-cell"><div class="num" id="totalVisits">—</div><div class="lbl">Total Visits</div></div>
      <div class="stat-cell"><div class="num" id="totalPlaying">—</div><div class="lbl">Playing Now</div></div>
    </div>
  </section>

  <section id="games">
    <h2>Games</h2>
    <div class="section-sub">Everything we've shipped, with live stats.</div>
    <div class="games-grid" id="gamesGrid"></div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <div class="section-sub">Join our community or reach out directly.</div>
    <a class="discord-btn" href="https://discord.gg/8N4Cy77Znd" target="_blank" rel="noopener">
      Join our Discord
    </a>
  </section>

  <script>
    fetch("/api/stats?type=groupGames&groupId=936632772")
      .then(r => r.json())
      .then(data => {
        document.getElementById("groupName").textContent = data.group.name;
        document.getElementById("memberCount").textContent = data.group.memberCount.toLocaleString();

        const totalVisits = data.games.reduce((sum, g) => sum + g.visits, 0);
        const totalPlaying = data.games.reduce((sum, g) => sum + g.playing, 0);
        document.getElementById("totalVisits").textContent = totalVisits.toLocaleString();
        document.getElementById("totalPlaying").textContent = totalPlaying.toLocaleString();

        const grid = document.getElementById("gamesGrid");
        data.games.forEach(g => {
          const card = document.createElement("div");
          card.className = "game-card";
          card.innerHTML = `
            <img src="${g.icon || ''}" alt="${g.name}">
            <div class="info">
              <div class="name">${g.name}</div>
              <div class="row">
                <div class="metric"><div class="v">${g.visits.toLocaleString()}</div><div class="k">Visits</div></div>
                <div class="metric"><div class="v">${g.playing.toLocaleString()}</div><div class="k">Playing</div></div>
                <div class="metric"><div class="v">${g.likeRatio}</div><div class="k">Likes</div></div>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById("groupName").textContent = "Error loading stats";
        document.getElementById("gamesGrid").innerHTML = `<div style="color:#f87171;font-size:13px;">${err.message}</div>`;
      });
  </script>
</body>
</html>
