<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Group Stats</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 50%, #00c6ff 100%);
    color: #fff;
    padding: 40px 20px;
    box-sizing: border-box;
  }
  h1 { text-align: center; font-size: 22px; margin-bottom: 30px; }
  .members { text-align: center; font-size: 16px; margin-bottom: 30px; opacity: 0.9; }
  .members b { font-size: 22px; }
  .games { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .game {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 14px 18px;
    backdrop-filter: blur(4px);
  }
  .game .name { font-weight: 600; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; opacity: 0.9; }
</style>
</head>
<body>
  <h1>Group Stats</h1>
  <div class="members">Members: <b id="memberCount">—</b></div>
  <div class="games" id="games"></div>

  <script>
    fetch("/api/stats?type=groupGames&groupId=936632772")
      .then(r => r.json())
      .then(data => {
        document.getElementById("memberCount").textContent = data.group.memberCount.toLocaleString();

        const container = document.getElementById("games");
        data.games.forEach(g => {
          const div = document.createElement("div");
          div.className = "game";
          div.innerHTML = `
            <div class="name">${g.name}</div>
            <div class="row"><span>Visits</span><span>${g.visits.toLocaleString()}</span></div>
            <div class="row"><span>Playing</span><span>${g.playing.toLocaleString()}</span></div>
            <div class="row"><span>Like Ratio</span><span>${g.likeRatio}</span></div>
          `;
          container.appendChild(div);
        });
      })
      .catch(err => {
        document.getElementById("memberCount").textContent = "Error: " + err.message;
      });
  </script>
</body>
</html>
